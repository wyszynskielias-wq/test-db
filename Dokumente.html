<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dokumente – Elias Wyszynski</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .subtitle { font-size: 0.9rem; color: var(--muted); line-height: 1.65; margin-top: -1.5rem; margin-bottom: 2rem; }

  .doc-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r);
    padding: 1rem 1.25rem;
    text-decoration: none;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 10px;
    transition: border-color 0.2s, background 0.2s;
  }
  .doc-card:hover { border-color: var(--accent); background: var(--hover); }

  .doc-icon {
    width: 38px; height: 38px;
    background: rgba(79,142,247,0.1);
    border: 1px solid rgba(79,142,247,0.2);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 1rem; flex-shrink: 0;
  }

  .doc-name { font-size: 0.9rem; font-weight: 500; }
  .doc-type { font-family: 'Space Mono', monospace; font-size: 10px; color: var(--muted); margin-top: 3px; }
  .doc-arrow { font-size: 0.9rem; color: var(--muted); margin-left: auto; }

  .contact-label { font-family: 'Space Mono', monospace; font-size: 10px; color: var(--accent); letter-spacing: 0.08em; margin-bottom: 0.5rem; }
  .contact-name { font-size: 1rem; font-weight: 500; margin-bottom: 3px; }
  .contact-detail { font-family: 'Space Mono', monospace; font-size: 11px; color: var(--muted); }
</style>
</head>
<body>
<div class="container">
  <a href="showcase.html" class="back">← zurück</a>
  <p class="eyebrow">// 03 — Unterlagen</p>
  <h1>Meine Dokumente</h1>
  <p class="subtitle">Alle Unterlagen stehen hier zum Download bereit.</p>

  <a href="Zeugnisse.pdf" class="doc-card" target="_blank">
    <div class="doc-icon">📋</div>
    <div>
      <p class="doc-name">Zeugnisse</p>
      <p class="doc-type">PDF · Schulabschluss & Nachweise</p>
    </div>
    <span class="doc-arrow">↓</span>
  </a>

  <a href="Lebenslauf Elias (1).pdf" class="doc-card" target="_blank">
    <div class="doc-icon">📄</div>
    <div>
      <p class="doc-name">Lebenslauf</p>
      <p class="doc-type">PDF · Elias Wyszynski</p>
    </div>
    <span class="doc-arrow">↓</span>
  </a>

  <div class="card" style="margin-top: 1.5rem;">
    <p class="contact-label">// KONTAKT</p>
    <p class="contact-name">Elias Wyszynski</p>
    <p class="contact-detail">Scharbeutz · Schleswig-Holstein</p>
  </div>

  <a href="showcase.html" class="btn btn-ghost">← zur Übersicht</a>
</div>
</body>
</html>
